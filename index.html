<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Cooking Today?</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top left, #263238 0%, #111827 35%, #070b12 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
}

.screen {
    display: none;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.screen.active {
    display: block;
}

.home {
    text-align: center;
    padding: 55px 30px;
}

.emoji {
    font-size: 65px;
    margin-bottom: 15px;
}

h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.subtitle {
    color: #cbd5e1;
    line-height: 1.6;
    margin-bottom: 30px;
}

button {
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    border-radius: 15px;
    transition: 0.2s;
}

.start-btn {
    width: 100%;
    padding: 16px 35px;
    background: white;
    color: #111827;
    font-size: 18px;
}

button:hover {
    transform: translateY(-2px);
    opacity: 0.92;
}

.progress {
    color: #94a3b8;
    margin-bottom: 12px;
    font-size: 14px;
}

.progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #facc15;
    transition: width 0.3s ease;
}

.question {
    font-size: 27px;
    line-height: 1.3;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 13px;
}

.answer {
    width: 100%;
    text-align: left;
    padding: 18px;
    background: rgba(255,255,255,0.08);
    color: white;
    border: 1px solid rgba(255,255,255,0.14);
}

.answer:hover {
    background: rgba(255,255,255,0.16);
}

.result-profile {
    background: rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 25px;
}

.profile-name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
}

.profile-text {
    color: #cbd5e1;
    line-height: 1.5;
}

.section-title {
    margin: 25px 0 12px;
    color: #e2e8f0;
}

.recipe-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
}

.recipe-card.top {
    border-color: rgba(250,204,21,0.45);
}

.recipe-rank {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 5px;
}

.recipe-name {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 6px;
}

.recipe-description {
    color: #cbd5e1;
    line-height: 1.45;
    font-size: 14px;
}

.recipe-details {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 8px;
}

.badge {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    background: rgba(255,255,255,0.1);
    color: #e2e8f0;
}

.restart-btn {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    background: white;
    color: #111827;
}

@media (max-width: 500px) {
    body {
        padding: 12px;
    }

    .screen {
        padding: 22px;
    }

    h1 {
        font-size: 34px;
    }

    .question {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div id="homeScreen" class="screen active home">
        <div class="emoji">🍳</div>

        <h1>What's Cooking Today?</h1>

        <p class="subtitle">
            Answer 10 questions about your cooking mood and discover
            which of the 8 healthy recipes matches you best.
        </p>

        <button class="start-btn" onclick="startQuiz()">
            START THE QUIZ
        </button>
    </div>


    <div id="quizScreen" class="screen">

        <div class="progress" id="progress">
            Question 1 of 10
        </div>

        <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
        </div>

        <div class="question" id="question">
            Question goes here
        </div>

        <div class="answers" id="answers"></div>

    </div>


    <div id="resultsScreen" class="screen">

        <h1>Your Cooking Profile 🍽️</h1>

        <div class="result-profile">
            <div class="profile-name" id="profileName"></div>
            <div class="profile-text" id="profileText"></div>
        </div>

        <h2 class="section-title">🔥 COOK NOW</h2>
        <div id="topRecipes"></div>

        <h2 class="section-title">🍴 YOUR FULL RANKING</h2>
        <div id="allRecipes"></div>

        <button class="restart-btn" onclick="restartQuiz()">
            TAKE THE QUIZ AGAIN
        </button>

    </div>

</div>

/* =========================================================
   QUIZ QUESTIONS
========================================================= */

const questions = [

    {
        question: "How much time would you actually spend cooking?",
        answers: [
            {
                text: "⚡ 5–10 minutes",

            },
            {

            },
            {
                text: "🍳 20–30 minutes",

            },
            {
                text: "👨‍🍳 30+ minutes — I'm committed",
                effects: { time: "very-long" }
            }
        ]
    },

    {
        question: "What are you craving right now?",
        answers: [
            {
                text: "🌶️ Something spicy and bold",
                effects: { flavour: "spicy" }
            },
            {
                text: "🍓 Something sweet",
                effects: { flavour: "sweet" }
            },
            {
                text: "🥗 Something fresh and light",
                effects: { flavour: "fresh" }
            },
            {
                text: "🧂 Something savoury",
                effects: { flavour: "savoury" }
            }
        ]
    },

    {
        question: "Pick your food category.",
        answers: [
            {
                text: "🥙 Starter",
                effects: { category: "starter" }
            },
            {
                text: "🍚 Main course",
                effects: { category: "main" }
            },
            {

                effects: { category: "salad" }
            },

    },

    {

            },

            },
            {
                text: "🥑 Creamy",
                effects: { texture: "creamy" }
            },
            {
                text: "🥣 A mixture of textures",

            }
        ]
    },

    {
        question: "How much effort are you willing to put in?",
        answers: [
            {
                text: "😴 Almost no effort",
                effects: { effort: "easy" }
            },
            {
                text: "🙂 A little cooking",
                effects: { effort: "easy" }
            },
            {
                text: "🍳 I'll cook properly",
                effects: { effort: "medium" }
            },
            {
                text: "👨‍🍳 Give me a challenge",
                effects: { effort: "challenge" }
            }
        ]
    },

    {
        question: "What matters most to you today?",
        answers: [
            {
                text: "💪 I want something healthy",
                effects: { priority: "healthy" }
            },
            {
                text: "😋 I mainly care about taste",
                effects: { priority: "taste" }
            },
            {
                text: "⚖️ I want a balance of both",
                effects: { priority: "balanced" }
            },
            {
                text: "✨ I want something interesting",
                effects: { adventure: "different" }
            }
        ]
    },

    {

        answers: [

            },
            {

                effects: { adventure: "slightly-different" }
            },
            {

            },
            {

            }
        ]
    },

    {

            {

            },
            {

            },
            {

                effects: { intensity: "strong" }
            },
            {
                text: "💥 Very bold",
                effects: { intensity: "strong" }
            }
        ]
    },

    {
        question: "What kind of meal sounds best right now?",
        answers: [
            {
                text: "🥑 Something light",
                effects: { light: true }
            },
            {
                text: "🍽️ Something filling",
                effects: { filling: true }
            },
            {
                text: "🍓 Something refreshing",
                effects: { refreshing: true }
            },
            {
                text: "🍰 Something comforting",

            }
        ]
    },

    {

            {

            {

            },
            {
                text: "👨‍🍳 Slow and carefully prepared",

            },

        ]

];


/* =========================================================
   QUIZ STATE
========================================================= */

let currentQuestion = 0;
let userAnswers = [];


/* =========================================================
   START QUIZ
========================================================= */

function startQuiz() {

    currentQuestion = 0;
    userAnswers = [];

    document.getElementById("homeScreen").classList.remove("active");
    document.getElementById("resultsScreen").classList.remove("active");
    document.getElementById("quizScreen").classList.add("active");

    showQuestion();
}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("progressFill").style.width =
        ((currentQuestion + 1) / questions.length * 100) + "%";

    document.getElementById("question").textContent =
        question.question;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    question.answers.forEach(function(answer) {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer.text;

        button.onclick = function() {
            selectAnswer(answer);
        };

        answersContainer.appendChild(button);

    });
}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(answer) {

    userAnswers.push(answer);

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        calculateResults();
    }
}


/* =========================================================
   CALCULATE RESULTS
========================================================= */
function calculateResults() {

    const rankedRecipes = recipes.map(function(recipe) {

        let score = 0;
        let reasons = [];

        userAnswers.forEach(function(answer) {

            const effects = answer.effects;

            if (effects.time) {

                if (effects.time === "fast" && recipe.time <= 10) {
                    score += 6;
                    reasons.push("quick");
                }

                if (effects.time === "medium" && recipe.time > 10 && recipe.time <= 20) {
                    score += 6;
                    reasons.push("fits your time");
                }

                if (effects.time === "long" && recipe.time > 20 && recipe.time <= 30) {
                    score += 6;
                    reasons.push("fits your time");
                }

                if (effects.time === "very-long" && recipe.time > 30) {
                    score += 6;
                    reasons.push("worth the extra time");
                }
            }

            if (effects.flavour && recipe.flavour === effects.flavour) {
                score += 7;
                reasons.push(effects.flavour + " flavour");
            }

            if (effects.category && recipe.category === effects.category) {
                score += 7;
                reasons.push(effects.category);
            }

            if (effects.texture && recipe.texture === effects.texture) {
                score += 6;
                reasons.push(effects.texture + " texture");
            }

            if (effects.effort && recipe.effort === effects.effort) {
                score += 5;
                reasons.push("right effort");
            }

            if (effects.priority === "healthy" && recipe.healthy === "high") {
                score += 6;
                reasons.push("healthy");
            }

            if (effects.priority === "taste" && recipe.priority === "taste") {
                score += 5;
                reasons.push("taste-focused");
            }

            if (effects.priority === "balanced" && recipe.healthy === "high") {
                score += 3;
            }

            if (effects.adventure && recipe.adventure === effects.adventure) {
                score += 4;
                reasons.push("matches your adventure level");
            }

            if (effects.intensity && recipe.intensity === effects.intensity) {
                score += 4;
                reasons.push("matches your flavour intensity");
            }

            if (effects.method === "any") {
                score += 1;
            }

            if (effects.method && effects.method !== "any" && recipe.method === effects.method) {
                score += 5;
                reasons.push("matches your cooking style");
            }

            if (effects.light && recipe.category === "salad") {
                score += 5;
                reasons.push("light");
            }

            if (effects.refreshing && recipe.flavour === "fresh") {
                score += 5;
                reasons.push("refreshing");
            }

            if (effects.comforting && recipe.category === "dessert") {
                score += 4;
                reasons.push("comforting");
            }

            if (effects.filling && recipe.category === "main") {
                score += 5;
                reasons.push("filling");
            }

        });

        return {
            ...recipe,
            score: score,
            reasons: [...new Set(reasons)]
        };

    });

    rankedRecipes.sort(function(a, b) {
        return b.score - a.score;
    });

    displayResults(rankedRecipes);
}
