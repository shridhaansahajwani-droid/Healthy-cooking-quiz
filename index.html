<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Cooking Today?</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
background:
radial-gradient(circle at top, rgba(22,100,163,0.45), transparent 40%),
linear-gradient(135deg, #07111f, #101827, #07111f);
color: white;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
width: 100%;
max-width: 850px;
}

.screen {
display: none;
text-align: center;
background: rgba(255,255,255,0.08);
border: 1px solid rgba(255,255,255,0.15);
border-radius: 25px;
padding: 45px 30px;
box-shadow: 0 20px 60px rgba(0,0,0,0.4);
backdrop-filter: blur(15px);
}

.screen.active {
display: block;
}

h1 {
font-size: clamp(38px, 8vw, 70px);
margin-bottom: 15px;
}

h2 {
font-size: 32px;
margin-bottom: 25px;
}

.subtitle {
color: #cbd5e1;
font-size: 18px;
line-height: 1.6;
margin-bottom: 35px;
}

button {
border: none;
cursor: pointer;
font-family: inherit;
}

.start-btn,
.restart-btn {
background: linear-gradient(135deg, #ff7a18, #ffb347);
color: white;
padding: 17px 35px;
border-radius: 50px;
font-size: 18px;
font-weight: bold;
transition: 0.2s;
}

.start-btn:hover,
.restart-btn:hover {
transform: scale(1.05);
}

.progress-container {
margin-bottom: 30px;
}

.progress-text {
color: #cbd5e1;
margin-bottom: 10px;
}

.progress-bar {
width: 100%;
height: 9px;
background: rgba(255,255,255,0.12);
border-radius: 20px;
overflow: hidden;
}

.progress-fill {
height: 100%;
width: 10%;
background: linear-gradient(90deg, #ff7a18, #ffb347);
transition: width 0.3s ease;
}

.question {
font-size: clamp(25px, 5vw, 38px);
line-height: 1.3;
margin-bottom: 30px;
}

.answers {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
}

.answer-btn {
background: rgba(255,255,255,0.09);
color: white;
border: 1px solid rgba(255,255,255,0.15);
border-radius: 18px;
padding: 20px;
font-size: 17px;
text-align: left;
transition: 0.2s;
}

.answer-btn:hover {
background: rgba(255,122,24,0.25);
border-color: #ff9b42;
transform: translateY(-3px);
}

.profile {
font-size: 27px;
font-weight: bold;
margin-bottom: 35px;
}

.top-three {
display: grid;
gap: 15px;
margin-bottom: 35px;
}

.recipe-card {
background: rgba(255,255,255,0.08);
border: 1px solid rgba(255,255,255,0.13);
border-radius: 18px;
padding: 20px;
text-align: left;
}

.recipe-card.top {
border-color: rgba(255,179,71,0.7);
background: rgba(255,122,24,0.12);
}

.rank {
color: #ffb347;
font-size: 15px;
font-weight: bold;
margin-bottom: 6px;
}

.recipe-name {
font-size: 22px;
font-weight: bold;
margin-bottom: 7px;
}

.recipe-info {
color: #cbd5e1;
font-size: 14px;
line-height: 1.5;
}

.section-title {
text-align: left;
margin-bottom: 15px;
font-size: 23px;
}

@media (max-width: 600px) {
body {
padding: 10px;
}

.screen {
padding: 30px 18px;
}

.answers {
grid-template-columns: 1fr;
}

.answer-btn {
padding: 17px;
}
}
</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<section id="homeScreen" class="screen active">
<h1>🍳</h1>

<h1>What's Cooking Today?</h1>

<p class="subtitle">
Answer 10 completely random questions about your food personality
and we'll figure out which recipes belong on your plate.
</p>

<button class="start-btn" onclick="startQuiz()">
START THE QUIZ
</button>
</section>


<!-- QUIZ -->
<section id="quizScreen" class="screen">

<div class="progress-container">
<div class="progress-text" id="progressText">
Question 1 of 10
</div>

<div class="progress-bar">
<div class="progress-fill" id="progressFill"></div>
</div>
</div>

<div class="question" id="questionText"></div>

<div class="answers" id="answersContainer"></div>

</section>


<!-- RESULTS -->
<section id="resultsScreen" class="screen">

<h2>Your Cooking Profile</h2>

<div class="profile" id="profileText"></div>

<div class="section-title">
🔥 COOK NOW
</div>

<div class="top-three" id="topThree"></div>

<div class="section-title">
📋 YOUR FULL RECIPE RANKING
</div>

<div id="fullRanking"></div>

<br>

<button class="restart-btn" onclick="restartQuiz()">
PLAY AGAIN
</button>

</section>

</div>


<script>

/* =========================================================
RECIPES
========================================================= */

const recipes = [

{
name: "Sautéed Paneer Mushroom Fusion",
category: "starter",
time: 20,
flavour: "spicy",
texture: "crunchy",
effort: "medium",
method: "stir",
priority: "taste",
adventure: "different",
intensity: "strong",
description: "A crunchy, spicy paneer and mushroom stir-fry."
},

{
name: " Avacado toast",
category: "starter",
time: 15,
flavour: "tangy",
texture: "crunchy",
effort: "easy",
method: "toast",
priority: "medium",
adventure: "familiar",
intensity: "medium",
description: " A creamy , zesty avocado spread on crisp toasted sourdough."
},

{
name: " kodhri mix",
category: "main",
time: 30,
flavour: "balanced",
texture: "soft",
effort: "medium",
method: "pan",
priority: "taste",
adventure: "different",
intensity: "strong",
description: "A wholesome nutty millet and lentil comforting mash."
},

{
name: " Soya rice",
category: "main",
time: 35,
flavour: "balanced",
texture: "soft",
effort: "hard",
method: "slow",
priority: "healthy",
adventure: "different",
intensity: "medium",
description: "A protein-rich savory rice stir-fry with juicy soya chunks."
},

{
name: "Cesar salad",
category: "salad",
time: 10,
flavour: "tangy",
texture: "fresh",
effort: "easy",
method: "fresh",
priority: "healthy",
adventure: "familiar",
intensity: "mild",
description: "A crunchy garlic crouton and fresh green Caesar medley."
},

{
name: " Veggie salad",
category: "salad",
time: 15,
flavour: "fresh",
texture: "fresh",
effort: "easy",
method: "fresh",
priority: "healthy",
adventure: "different",
intensity: "mild",
description: "A garden-fresh crisp vegetable mix with elegant herb dressing."
},
{
name: "Soya kebab",
category: "starter",
time: 20,
flavour: "spicy",
texture: "soft",
effort: "medium",
method: "stir",
priority: "taste",
adventure: "familiar",
intensity: "medium",
description: "A kebab make of soya filled with protein"
},
{
name: " Blueberry smoothie",
category: "dessert",
time: 15,
flavour: "sweet",
texture: "soft",
effort: "easy",
method: "fresh",
priority: "taste",
adventure: "familiar",
intensity: "medium",
description: "A thick velvety blueberry smoothie with a refreshing zesty twist."
},

{
name: "Aata cake",
category: "dessert",
time: 30,
flavour: "sweet",
texture: "creamy",
effort: "medium",
method: "slow",
priority: "taste",
adventure: "different",
intensity: "strong",
description: "A soft moist whole wheat cake with a rich nutty warmth."
},

];


/* =========================================================
QUESTIONS
========================================================= */

const questions = [

{
text: "How much time are you willing to spend making your food?",
answers: [
{ text: "A — ⚡ 5–10 minutes", effects: { time: 10 } },
{ text: "B — 🕐 10–20 minutes", effects: { time: 20 } },
{ text: "C — ⏳ 20–30 minutes", effects: { time: 30 } },
{ text: "D — 👨‍🍳 30+ minutes", effects: { time: 40 } }
]
},

{
text: "What are you craving right now?",
answers: [
{ text: "A — 🌶️ Spicy / bold", effects: { flavour: "spicy" } },
{ text: "B — 🍰 Sweet", effects: { flavour: "sweet" } },
{ text: "C — 🍋 Sour / tangy", effects: { flavour: "tangy" } },
{ text: "D — 🥗 Fresh / light", effects: { flavour: "fresh" } }
]
},

{
text: "What kind of food are you looking for?",
answers: [
{ text: "A — 🍽️ Starter / small bite", effects: { category: "starter" } },
{ text: "B — 🍛 Proper main meal", effects: { category: "main" } },
{ text: "C — 🥗 Fresh / light", effects: { category: "salad" } },
{ text: "D — 🍰 Sweet / dessert", effects: { category: "dessert" } }
]
},

{
text: "Pick the texture you'd enjoy most.",
answers: [
{ text: "A — 🥨 Crunchy", effects: { texture: "crunchy" } },
{ text: "B — 🥣 Soft / creamy", effects: { texture: "soft" } },
{ text: "C — 🍉 Fresh / juicy", effects: { texture: "fresh" } },
{ text: "D — 🤯 A mixture of textures", effects: { texture: "mixed" } }
]
},

{
text: "How much cooking effort are you willing to put in?",
answers: [
{ text: "A — 😴 Almost no effort", effects: { effort: "easy" } },
{ text: "B — 🙂 A little cooking", effects: { effort: "medium" } },
{ text: "C — 👨‍🍳 Happy to cook properly", effects: { effort: "hard" } },
{ text: "D — 🔥 Give me a challenge", effects: { effort: "hard" } }
]
},

{
text: "Which cooking style sounds best right now?",
answers: [
{ text: "A — 🍳 Stir-fried / pan-cooked", effects: { method: "stir" } },
{ text: "B — 🔥 Grilled / roasted", effects: { method: "grill" } },
{ text: "C — 🥗 Fresh / no-cook", effects: { method: "fresh" } },
{ text: "D — 🫕 Cooked slowly / more involved", effects: { method: "slow" } }
]
},

{
text: "What's the most important thing about your food today?",
answers: [
{ text: "A — ⚡ Quick", effects: { priority: "quick" } },
{ text: "B — 😋 Taste", effects: { priority: "taste" } },
{ text: "C — 🥗 Healthy / fresh", effects: { priority: "healthy" } },
{ text: "D — 🧪 Interesting", effects: { priority: "interesting" } }
]
},

{
text: "How adventurous are you feeling?",
answers: [
{ text: "A — 👍 Keep it familiar", effects: { adventure: "familiar" } },
{ text: "B — 🙂 Slightly different", effects: { adventure: "different" } },
{ text: "C — 😈 Surprise me", effects: { adventure: "surprising" } },
{ text: "D — 🤯 Completely different", effects: { adventure: "extreme" } }
]
},

{
text: "What kind of flavour intensity do you want?",
answers: [
{ text: "A — 🌶️ Strong / punchy", effects: { intensity: "strong" } },
{ text: "B — 😌 Medium and balanced", effects: { intensity: "medium" } },
{ text: "C — 🌿 Mild / subtle", effects: { intensity: "mild" } },
{ text: "D — 🍋 Fresh / refreshing", effects: { intensity: "fresh" } }
]
},

{
text: "What time do you eat dinner?",
answers: [
{ text: "A — ⚡6 - 7 PM", effects: { style: "aggressive" } },
{ text: "B — 😎 7 - 8 PM", effects: { style: "balanced" } },
{ text: "C — 🧠 8 - 9 PM", effects: { style: "strategic" } },
{ text: "D — 💥 9 - 10 PM", effects: { style: "power" } }
]
}

];


/* =========================================================
QUIZ VARIABLES
========================================================= */

let currentQuestion = 0;
let userAnswers = [];


/* =========================================================
START QUIZ
========================================================= */

function startQuiz() {

currentQuestion = 0;
userAnswers = [];

document.getElementById("homeScreen").classList.remove("active");
document.getElementById("resultsScreen").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");

showQuestion();

}


/* =========================================================
SHOW QUESTION
========================================================= */

function showQuestion() {

const question = questions[currentQuestion];

document.getElementById("questionText").textContent = question.text;

document.getElementById("progressText").textContent =
"Question " + (currentQuestion + 1) + " of " + questions.length;

document.getElementById("progressFill").style.width =
((currentQuestion + 1) / questions.length * 100) + "%";

const container = document.getElementById("answersContainer");

container.innerHTML = "";

question.answers.forEach((answer, index) => {

const button = document.createElement("button");

button.className = "answer-btn";
button.textContent = answer.text;

button.onclick = function() {
selectAnswer(index);
};

container.appendChild(button);

});

}


/* =========================================================
SELECT ANSWER
========================================================= */

function selectAnswer(answerIndex) {

const answer = questions[currentQuestion].answers[answerIndex];

userAnswers.push(answer.effects);

currentQuestion++;

if (currentQuestion < questions.length) {

showQuestion();

} else {

showResults();

}

}


/* =========================================================
SCORE RECIPES
========================================================= */

function calculateScores() {

return recipes.map(recipe => {

let score = 0;

userAnswers.forEach(answer => {

/* Time */
if (answer.time) {

const difference = Math.abs(recipe.time - answer.time);

if (difference <= 5) {
score += 12;
} else if (difference <= 10) {
score += 7;
} else if (difference <= 20) {
score += 3;
}

}

/* Category */
if (answer.category && recipe.category === answer.category) {
score += 18;
}

/* Flavour */
if (answer.flavour && recipe.flavour === answer.flavour) {
score += 14;
}

/* Texture */
if (answer.texture && recipe.texture === answer.texture) {
score += 10;
}

/* Effort */
if (answer.effort && recipe.effort === answer.effort) {
score += 9;
}

/* Cooking method */
if (answer.method && recipe.method === answer.method) {
score += 9;
}

/* Priority */
if (answer.priority && recipe.priority === answer.priority) {
score += 9;
}

/* Adventure */
if (answer.adventure && recipe.adventure === answer.adventure) {
score += 7;
}

/* Intensity */
if (answer.intensity && recipe.intensity === answer.intensity) {
score += 8;
}

});

return {
...recipe,
score: score
};

});

}


/* =========================================================
PROFILE
========================================================= */

function getProfile() {

let aggressive = false;
let adventurous = false;
let healthy = false;
let quick = false;

userAnswers.forEach(answer => {

if (answer.style === "aggressive" || answer.style === "power") {
aggressive = true;
}

if (
answer.adventure === "surprising" ||
answer.adventure === "extreme"
) {
adventurous = true;
}

if (answer.priority === "healthy") {
healthy = true;
}

if (answer.priority === "quick") {
quick = true;
}

});

if (aggressive && quick) {
return "⚡ The Aggressive Opener";
}

if (adventurous) {
return "🧪 The Experimental All-Rounder";
}

if (healthy) {
return "🥗 The Smart Strategist";
}

return "🎯 The Balanced Player";

}


/* =========================================================
SHOW RESULTS
========================================================= */

function showResults() {

document.getElementById("quizScreen").classList.remove("active");
document.getElementById("resultsScreen").classList.add("active");

const scoredRecipes = calculateScores();

scoredRecipes.sort((a, b) => b.score - a.score);

document.getElementById("profileText").textContent = getProfile();

const topThree = document.getElementById("topThree");

topThree.innerHTML = "";

scoredRecipes.slice(0, 3).forEach((recipe, index) => {

const card = document.createElement("div");

card.className = "recipe-card top";

card.innerHTML = `
<div class="rank">#${index + 1} — COOK NOW</div>
<div class="recipe-name">${recipe.name}</div>
<div class="recipe-info">
${recipe.description}<br>
⏱️ ${recipe.time} minutes
</div>
`;

topThree.appendChild(card);

});


const ranking = document.getElementById("fullRanking");

ranking.innerHTML = "";

scoredRecipes.forEach((recipe, index) => {

const card = document.createElement("div");

card.className = "recipe-card";

const status = index < 3 ? "🔥 COOK NOW" : "🕐 TRY LATER";

card.innerHTML = `
<div class="rank">#${index + 1} — ${status}</div>
<div class="recipe-name">${recipe.name}</div>
<div class="recipe-info">
${recipe.description}<br>
⏱️ ${recipe.time} minutes
</div>
`;

ranking.appendChild(card);

});

}


/* =========================================================
RESTART
========================================================= */

function restartQuiz() {

document.getElementById("resultsScreen").classList.remove("active");
document.getElementById("homeScreen").classList.add("active");

currentQuestion = 0;
userAnswers = [];

}

</script>

</body>
</html>
