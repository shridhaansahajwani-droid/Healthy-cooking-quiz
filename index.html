let currentQuestion = 0;
let userAnswers = [];


function startQuiz() {

    currentQuestion = 0;
    userAnswers = [];

    document.getElementById("homeScreen").classList.remove("active");
    document.getElementById("resultsScreen").classList.remove("active");
    document.getElementById("quizScreen").classList.add("active");

    showQuestion();
}


function showQuestion() {

    const question = questions[currentQuestion];

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    document.getElementById("question").textContent =
        question.question;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";

    question.answers.forEach((answer) => {

        const button = document.createElement("button");

        button.className = "answer";
        button.textContent = answer.text;

        button.onclick = function() {
            selectAnswer(answer);
        };

        answersContainer.appendChild(button);

    });
}


function selectAnswer(answer) {

    userAnswers.push(answer.effects);

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        calculateScores();

    }
}


function calculateScores() {

    const scores = [];

    recipes.forEach(recipe => {

        let score = 0;

        userAnswers.forEach(answer => {

            if (answer.time) {

                if (answer.time === "fast" && recipe.time <= 10)
                    score += 5;

                if (
                    answer.time === "medium" &&
                    recipe.time > 10 &&
                    recipe.time <= 20
                )
                    score += 5;

                if (
                    answer.time === "long" &&
                    recipe.time > 20 &&
                    recipe.time <= 30
                )
                    score += 5;

                if (
                    answer.time === "very-long" &&
                    recipe.time > 30
                )
                    score += 5;
            }


            if (answer.flavour === recipe.flavour)
                score += 6;


            if (answer.category === recipe.category)
                score += 8;


            if (answer.texture === recipe.texture)
                score += 5;


            if (answer.effort === recipe.effort)
                score += 4;


            if (
                answer.method === "any" ||
                answer.method === recipe.method
            )
                score += 4;


            if (answer.priority === recipe.priority)
                score += 5;


            if (
                answer.priority === "quick" &&
                recipe.time <= 15
            )
                score += 3;


            if (answer.adventure === recipe.adventure)
                score += 5;


            if (
                answer.adventure === "wild" &&
                recipe.adventure === "different"
            )
                score += 3;


            if (answer.intensity === recipe.intensity)
                score += 4;


            if (
                answer.intensity === "fresh" &&
                recipe.flavour === "fresh"
            )
                score += 3;


            if (answer.style === "aggressive") {

                if (
                    recipe.flavour === "spicy" ||
                    recipe.intensity === "strong"
                )
                    score += 3;
            }


            if (answer.style === "allrounder") {

                if (
                    recipe.healthy === "high" &&
                    recipe.effort === "medium"
                )
                    score += 3;
            }


            if (answer.style === "strategic") {

                if (
                    recipe.healthy === "high" ||
                    recipe.time <= 20
                )
                    score += 3;
            }


            if (answer.style === "power") {

                if (
                    recipe.intensity === "strong" ||
                    recipe.flavour === "sweet"
                )
                    score += 3;
            }

        });


        scores.push({
            recipe: recipe,
            score: score
        });

    });


    scores.sort((a, b) => b.score - a.score);

    showResults(scores);
}
